name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_SERVER_REPO: shopsmart-server
  ECR_CLIENT_REPO: shopsmart-client
  ECS_SERVICE: shopsmart-service
  ECS_CLUSTER: shopsmart-cluster
  ECS_TASK_DEFINITION: .aws/task-definition.json

jobs:
  deploy:
    name: Deploy Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Server Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_SERVER_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_SERVER_REPO:latest ./server
          docker push --all-tags $ECR_REGISTRY/$ECR_SERVER_REPO

      - name: Build and Push Client Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg VITE_API_URL=http://3.82.194.67:5001 -t $ECR_REGISTRY/$ECR_CLIENT_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_CLIENT_REPO:latest ./client
          docker push --all-tags $ECR_REGISTRY/$ECR_CLIENT_REPO


      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition shopsmart-task-def --query taskDefinition > task-definition.json

      - name: Fill in the new Server Image in the ECS Task Definition
        id: task-def-server
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: shopsmart-server
          image: ${{ steps.login-ecr.outputs.registry }}/shopsmart-server:${{ github.sha }}

      - name: Fill in the new Client Image in the ECS Task Definition
        id: task-def-client
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-server.outputs.task-definition }}
          container-name: shopsmart-client
          image: ${{ steps.login-ecr.outputs.registry }}/shopsmart-client:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-client.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
